version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rhino-postgres
    environment:
      POSTGRES_DB: rhino
      POSTGRES_USER: rhinoadminuser
      POSTGRES_PASSWORD: rhinosecpass951
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhinoadminuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rhino-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rhino
      DB_USER: rhinoadminuser
      DB_PASSWORD: rhinosecpass951
      JWT_SECRET: your_jwt_secret_change_me
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      ENABLE_SIMULATOR: "true"
      ENABLE_SCHEDULER: "true"
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rhino-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
