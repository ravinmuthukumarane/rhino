version: '3.9'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: rhino-postgres
    environment:
      POSTGRES_DB: rhino
      POSTGRES_USER: rhinoadminuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Postgres runs everything in /docker-entrypoint-initdb.d/ once, in filename
      # order, only when the data volume is empty (first boot on a fresh server).
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/src/db/timescale.sql:/docker-entrypoint-initdb.d/02_timescale.sql:ro
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhinoadminuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rhino-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rhino
      DB_USER: rhinoadminuser
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      ENABLE_SIMULATOR: "true"
      SIMULATOR_INTERVAL_MS: 5000
      ENABLE_MQTT: "false"
      ENABLE_SCHEDULER: "true"
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rhino-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  postgres_data:
