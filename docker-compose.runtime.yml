version: '3.9'

# Runtime-only deploy file: references pre-built images by name, no `build:`
# context and no bind mounts into the source tree. This is the only file
# (alongside .env) that needs to remain on the server after building —
# see DEPLOY.md.

services:
  postgres:
    image: rhino-postgres:latest
    container_name: rhino-postgres
    environment:
      POSTGRES_DB: rhino
      POSTGRES_USER: rhinoadminuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhinoadminuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: rhino-backend:latest
    container_name: rhino-backend
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach the EMQX broker running directly on the host
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rhino
      DB_USER: rhinoadminuser
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      ENABLE_SIMULATOR: "false"
      ENABLE_MQTT: "true"
      MQTT_BROKER_URL: mqtt://host.docker.internal:1883
      ENABLE_SCHEDULER: "true"
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  frontend:
    image: rhino-frontend:latest
    container_name: rhino-frontend
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: rhino-certbot
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do sleep 6h; done"]
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    restart: unless-stopped

volumes:
  postgres_data:
  certbot_certs:
  certbot_webroot:
